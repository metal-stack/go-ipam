---
name: metal-stack component release

on:
  pull_request:
    branches:
      - master
  release:
    types:
      - published
  push:
    branches:
      - master

jobs:
  draft:
    uses: metal-stack/actions-common/.github/workflows/release-drafter.yaml@v1

  container-build:
    uses: metal-stack/actions-common/.github/workflows/container-build.yaml@v1
    secrets: inherit

  go-lint:
    uses: metal-stack/actions-common/.github/workflows/go-lint.yaml@v1

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:

    - name: Set up Go 1.27
      uses: actions/setup-go@v7
      with:
        go-version: "1.27"
        cache: false
      id: go

    - name: Check out code into the Go module directory
      uses: actions/checkout@v7

    - name: break if proto modifications where not committed
      run: |
        make proto

    - name: Check if there are changes
      uses: tj-actions/verify-changed-files@v20
      id: verify-changed-files

    - name: Process changes
      if: steps.verify-changed-files.outputs.files_changed == 'true'
      run: echo "Changes exist"

    - name: build and test
      run: |
        make ci

    - name: Upload code coverage
      uses: codecov/codecov-action@v6
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        verbose: true # optional (default = false)

  bench:
    name: Benchmark
    runs-on: ubuntu-latest
    steps:

    - name: Set up Go 1.27
      uses: actions/setup-go@v7
      with:
        go-version: "1.27"
        cache: false
      id: go

    - name: Check out code into the Go module directory
      uses: actions/checkout@v7

    - name: run benchmark
      run: |
        make bench | tee output.txt

    - name: Download previous benchmark data
      uses: actions/cache@v6
      with:
        path: ./cache
        key: ${{ runner.os }}-benchmark

    - name: Store benchmark result
      uses: benchmark-action/github-action-benchmark@v1
      with:
        tool: 'go'
        output-file-path: output.txt
        external-data-json-path: ./cache/benchmark-data.json
         # GitHub API token to make a commit comment
        github-token: ${{ secrets.GITHUB_TOKEN }}
        fail-on-alert: true
